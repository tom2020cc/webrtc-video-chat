<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多人音视频通话</title>
    <script src="./js/socket.io.min.js"></script>
    <script src="./js/peerjs.min.js"></script>
    <script src="./js/subtitles.js"></script>
    <link rel="stylesheet" href="./css/i.css">
</head>
<body>
    <!-- 顶栏 -->
    <header class="topbar">
        <div class="brand">
            <span class="logo">🎥</span>
            <h1>多人音视频通话</h1>
        </div>
        <div class="meta">
            <span class="pill" title="昵称">😀 <span id="userNickname">…</span></span>
            <span class="pill" title="PeerID">🆔 <span id="userPeerId">加载中…</span></span>
            <span class="pill" title="设备ID">📱 <span id="deviceId">生成中…</span></span>
            <span class="pill" title="地理位置">🌍 <span id="locationInfo">定位中…</span></span>
            <span class="pill" title="当前房间">🏠 <span id="currentRoomId">未加入房间</span></span>
            <span class="pill timer hidden" id="callTimerPill" title="通话时长">⏱ <span id="callTimer">00:00</span></span>
        </div>
        <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
        <button class="icon-btn" id="settingsBtn" title="环境与设置">⚙️</button>
    </header>

    <!-- 主区域 -->
    <main class="layout">
        <!-- 视频区 -->
        <section class="video-area">
            <div id="videoContainer" class="videos">
                <div class="video-placeholder" id="videoPlaceholder">
                    <div class="ph-icon">🎬</div>
                    <p>创建或加入房间后，这里将显示视频画面</p>
                </div>
            </div>

            <!-- AI 字幕覆盖层 -->
            <div id="subtitleOverlay" class="subtitle-overlay hidden">
                <div class="subtitle-box">
                    <div class="subtitle-original" id="subtitleOriginal"></div>
                    <div class="subtitle-translated" id="subtitleTranslated"></div>
                </div>
            </div>

            <!-- 房间操作 -->
            <div class="room-bar">
                <div class="room-controls" id="roomControls">
                    <input type="text" id="roomId" placeholder="输入房间号，例如 123">
                    <input type="text" id="roomPassword" placeholder="密码(可选)">
                    <button id="createRoomBtn">＋ 创建房间</button>
                </div>
                <div class="in-room-chip hidden" id="inRoomChip"></div>
                <div class="room-list" id="roomList"></div>
            </div>
        </section>

        <!-- 右侧栏：成员 + 聊天 -->
        <aside class="sidebar">
            <section class="panel members">
                <h3>👥 在线成员 <span class="badge" id="memberCount">0</span></h3>
                <ul id="memberList"></ul>
            </section>
            <section class="panel chat">
                <h3>💬 聊天室
                    <button class="icon-btn" id="subtitleHistoryBtn" title="查看字幕历史" style="font-size: 0.7rem; padding: 4px 8px;">📝</button>
                    <button class="icon-btn" id="clearChatBtn" title="清空聊天记录" style="font-size: 0.7rem; padding: 4px 8px;">🗑️</button>
                    <button class="icon-btn" id="whatsappShareBtn" title="分享WhatsApp信息" style="font-size: 0.7rem; padding: 4px 8px;">📱</button>
                    <button class="icon-btn" id="adminLoginBtn" title="管理员登录" style="font-size: 0.7rem; padding: 4px 8px;">🔐</button>
                </h3>
                <div id="chatMessages" class="chat-messages"></div>
                <div id="emojiPanel" class="emoji-panel hidden"></div>
                <form id="chatForm" class="chat-form" autocomplete="off">
                    <button type="button" id="emojiBtn" class="emoji-btn" title="表情">😊</button>
                    <input id="chatInput" placeholder="说点什么…(回车发送)" autocomplete="off">
                    <button type="submit" id="chatSendBtn" disabled>📤 发送</button>
                </form>
            </section>
        </aside>
    </main>

    <!-- 底部控制栏 -->
    <footer class="controlbar">
        <button class="ctrl-btn" id="muteBtn" title="切换麦克风 (M)"><span class="ico">🎙️</span><span class="txt">静音</span></button>
        <button class="ctrl-btn" id="cameraBtn" title="切换摄像头 (V)"><span class="ico">📷</span><span class="txt">关摄像头</span></button>
        <button class="ctrl-btn" id="screenBtn" title="共享屏幕 (S)"><span class="ico">🖥️</span><span class="txt">共享屏幕</span></button>
        <button class="ctrl-btn" id="raiseHandBtn" title="举手 (R)"><span class="ico">✋</span><span class="txt">举手</span></button>
        <button class="ctrl-btn" id="snapshotBtn" title="截图"><span class="ico">📸</span><span class="txt">截图</span></button>
        <button class="ctrl-btn" id="imageBtn" title="发送图片 (I)"><span class="ico">🖼️</span><span class="txt">图片</span></button>
        <button class="ctrl-btn" id="fileBtn" title="发送文件"><span class="ico">📁</span><span class="txt">发送文件</span></button>
        <button class="ctrl-btn" id="copyRoomBtn" title="复制房间号"><span class="ico">🔗</span><span class="txt">复制房号</span></button>
        <button class="ctrl-btn" id="subtitleBtn" title="AI字幕 (T)"><span class="ico">📝</span><span class="txt">字幕</span></button>
        <button class="ctrl-btn danger" id="hangupBtn" title="离开房间" disabled><span class="ico">📞</span><span class="txt">离开房间</span></button>
    </footer>

    <!-- 隐藏的图片输入 -->
    <input type="file" id="imageInput" accept="image/*" hidden>

    <!-- 文件传输区域 -->
    <div id="fileTransferArea" class="file-transfer-area hidden">
        <div class="file-transfer-header">
            <h3>📁 文件传输</h3>
            <button class="icon-btn" id="closeFileArea" title="关闭">✕</button>
        </div>
        <div id="fileList" class="file-list">
            <!-- 文件列表将动态生成 -->
        </div>
    </div>

    <!-- 隐藏的文件输入 -->
    <input type="file" id="fileInput" class="hidden" multiple>

    <!-- 设置弹窗 -->
    <div id="settingsModal" class="modal hidden">
        <div class="modal-box">
            <div class="modal-head">
                <h3>⚙️ 环境与设置</h3>
                <button class="icon-btn" id="cfgClose" title="关闭">✕</button>
            </div>

            <div class="field-group">
                <label class="field-label">环境预设</label>
                <div class="presets">
                    <button class="preset-btn" id="presetLocal" type="button">💻 本地测试</button>
                    <button class="preset-btn" id="presetProd" type="button">🌐 生产环境</button>
                    <button class="preset-btn" id="presetCustom" type="button">⚙️ 自定义配置</button>
                </div>
            </div>

            <label class="field"><span>昵称</span><input id="cfgNickname" type="text" placeholder="你的昵称"></label>
            <label class="field"><span>服务器地址（Socket.IO）</span><input id="cfgServerUrl" type="text" placeholder="http://localhost:3000"></label>
            <label class="field"><span>PeerJS 服务器地址</span><input id="cfgPeerHost" type="text" placeholder="localhost"></label>
            <label class="field"><span>PeerJS 端口</span><input id="cfgPeerPort" type="text" placeholder="留空 = 默认 80/443"></label>
            <label class="field checkbox"><input id="cfgSecure" type="checkbox"><span>使用 HTTPS（生产环境请勾选）</span></label>
            <label class="field checkbox"><input id="cfgSound" type="checkbox"><span>提示音（消息 / 加入 / 举手等）</span></label>

            <div class="field-group">
                <label class="field-label">通话行为</label>
                <label class="field checkbox"><input id="cfgRequirePassword" type="checkbox"><span>创建房间时需要密码</span></label>
                <label class="field" id="cfgDefaultPasswordField"><span>默认密码</span><input id="cfgDefaultPassword" type="text" placeholder="需要密码时自动填入"></label>
                <label class="field checkbox"><input id="cfgCamOn" type="checkbox"><span>进入房间自动开启摄像头</span></label>
                <label class="field checkbox"><input id="cfgMicOn" type="checkbox"><span>进入房间自动开启麦克风</span></label>
            </div>

            <div class="field-group">
                <label class="field-label">🤖 AI 字幕与翻译</label>
                <label class="field checkbox"><input id="cfgAiEnabled" type="checkbox"><span>启用AI功能（语音识别+实时翻译）</span></label>
                <label class="field">
                    <span>语音识别引擎</span>
                    <select id="cfgSttEngine">
                        <option value="browser">🌐 浏览器内置 (Web Speech API)</option>
                        <option value="whisper">🎙️ OpenAI Whisper</option>
                        <option value="custom">⚡ 自定义API</option>
                    </select>
                </label>
                <label class="field">
                    <span>翻译服务</span>
                    <select id="cfgTranslationApi">
                        <option value="openai">🤖 OpenAI Translation</option>
                        <option value="deepl">🌍 DeepL API</option>
                        <option value="google">🔍 Google Cloud Translation</option>
                        <option value="baidu">🇨🇳 百度翻译API</option>
                    </select>
                </label>
                <label class="field">
                    <span>API 密钥</span>
                    <input id="cfgApiKey" type="password" placeholder="输入翻译服务的API密钥">
                </label>
                <label class="field">
                    <span>源语言</span>
                    <select id="cfgSourceLang">
                        <option value="auto">🔤 自动检测</option>
                        <option value="zh-CN">🇨🇳 中文（普通话）</option>
                        <option value="en-US">🇺🇸 英语（美国）</option>
                        <option value="ja-JP">🇯🇵 日语</option>
                        <option value="ko-KR">🇰🇷 韩语</option>
                        <option value="fr-FR">🇫🇷 法语</option>
                        <option value="de-DE">🇩🇪 德语</option>
                        <option value="es-ES">🇪🇸 西班牙语</option>
                    </select>
                </label>
                <label class="field">
                    <span>目标语言</span>
                    <select id="cfgTargetLang">
                        <option value="en-US">🇺🇸 英语（美国）</option>
                        <option value="zh-CN">🇨🇳 中文（普通话）</option>
                        <option value="ja-JP">🇯🇵 日语</option>
                        <option value="ko-KR">🇰🇷 韩语</option>
                        <option value="fr-FR">🇫🇷 法语</option>
                        <option value="de-DE">🇩🇪 德语</option>
                        <option value="es-ES">🇪🇸 西班牙语</option>
                    </select>
                </label>
                <label class="field">
                    <span>字幕位置</span>
                    <select id="cfgSubtitlePosition">
                        <option value="bottom">⬇️ 底部</option>
                        <option value="top">⬆️ 顶部</option>
                    </select>
                </label>
                <label class="field">
                    <span>字幕样式 - 字体大小</span>
                    <select id="cfgSubtitleFontSize">
                        <option value="small">小</option>
                        <option value="medium" selected>中</option>
                        <option value="large">大</option>
                        <option value="x-large">特大</option>
                    </select>
                </label>
                <label class="field">
                    <span>字幕样式 - 背景颜色</span>
                    <select id="cfgSubtitleBgColor">
                        <option value="semi-transparent" selected>半透明黑色</option>
                        <option value="transparent">透明</option>
                        <option value="solid">纯黑色</option>
                        <option value="white-transparent">半透明白色</option>
                        <option value="white-solid">纯白色</option>
                    </select>
                </label>
                <label class="field checkbox">
                    <input id="cfgAutoClearSubtitle" type="checkbox" checked>
                    <span>自动清除字幕（8秒后）</span>
                </label>
            </div>

            <div class="modal-actions">
                <button id="cfgSave" class="primary">保存并重启</button>
                <button id="cfgCancel">取消</button>
            </div>
        </div>
    </div>

    <!-- 加入房间弹窗（密码） -->
    <div id="joinModal" class="modal hidden">
        <div class="modal-box">
            <div class="modal-head">
                <h3>🔐 进入房间 <span id="joinRoomName"></span></h3>
                <button class="icon-btn" id="joinClose" title="关闭">✕</button>
            </div>
            <label class="field"><span>房间密码（无密码请留空）</span><input id="joinPassword" type="text" placeholder="输入密码"></label>
            <div class="modal-actions">
                <button id="joinConfirm" class="primary">进入</button>
                <button id="joinCancel">取消</button>
            </div>
        </div>
    </div>

    <!-- 管理员登录弹窗 -->
    <div id="adminLoginModal" class="modal hidden">
        <div class="modal-box">
            <div class="modal-head">
                <h3>🔐 管理员登录</h3>
                <button class="icon-btn" id="adminLoginClose" title="关闭">✕</button>
            </div>
            <label class="field"><span>管理员密码</span><input id="adminPassword" type="password" placeholder="输入管理员密码"></label>
            <div class="modal-actions">
                <button id="adminLoginConfirm" class="primary">登录</button>
                <button id="adminLoginCancel">取消</button>
            </div>
        </div>
    </div>

    <!-- 管理面板弹窗 -->
    <div id="adminPanelModal" class="modal hidden">
        <div class="modal-box modal-large">
            <div class="modal-head">
                <h3>👑 管理面板</h3>
                <button class="icon-btn" id="adminPanelClose" title="关闭">✕</button>
            </div>

            <div class="field-group">
                <label class="field-label">房间管理</label>
                <label class="field"><span>房间号</span><input id="adminClearRoomId" type="text" placeholder="留空 = 当前房间"></label>
                <div class="modal-actions">
                    <button id="adminClearRoomBtn" class="danger-btn">🗑️ 清除该房间</button>
                </div>
            </div>

            <div class="field-group">
                <label class="field-label">操作日志</label>
                <div class="modal-actions">
                    <button id="adminRefreshLogsBtn">🔄 刷新日志</button>
                </div>
                <div id="adminLogsList" class="admin-logs-list">暂无日志</div>
            </div>
        </div>
    </div>

    <!-- WhatsApp设置弹窗 -->
    <div id="whatsappModal" class="modal hidden">
        <div class="modal-box">
            <div class="modal-head">
                <h3>📱 WhatsApp信息设置</h3>
                <button class="icon-btn" id="whatsappClose" title="关闭">✕</button>
            </div>
            <label class="field"><span>WhatsApp号码</span><input id="whatsappNumber" type="text" placeholder="+86 138 0000 0000"></label>
            <label class="field"><span>显示名称</span><input id="whatsappDisplayName" type="text" placeholder="您的名字"></label>
            <div class="modal-actions">
                <button id="whatsappSave" class="primary">保存</button>
                <button id="whatsappCancel">取消</button>
            </div>
        </div>
    </div>

    <!-- 图片预览模态框 -->
    <div id="imagePreviewModal" class="image-preview-modal">
        <div class="image-preview-content">
            <button class="image-preview-close" id="closeImagePreview">✕</button>
            <img id="previewImage" src="" alt="图片预览">
        </div>
    </div>

    <!-- 字幕历史查看模态框 -->
    <div id="subtitleHistoryModal" class="modal hidden">
        <div class="modal-box modal-large">
            <div class="modal-head">
                <h3>📝 字幕历史记录 <span id="subtitleHistoryRoom"></span></h3>
                <button class="icon-btn" id="subtitleHistoryClose" title="关闭">✕</button>
            </div>

            <div class="subtitle-history-controls">
                <div class="search-bar">
                    <input type="text" id="subtitleSearchInput" placeholder="搜索字幕内容...">
                    <button id="subtitleSearchBtn">🔍 搜索</button>
                </div>
                <div class="filter-controls">
                    <select id="subtitleLangFilter">
                        <option value="all">所有语言</option>
                        <option value="zh-CN">中文</option>
                        <option value="en-US">英语</option>
                        <option value="ja-JP">日语</option>
                        <option value="ko-KR">韩语</option>
                    </select>
                    <select id="subtitleTimeFilter">
                        <option value="all">全部时间</option>
                        <option value="today">今天</option>
                        <option value="week">本周</option>
                        <option value="month">本月</option>
                    </select>
                </div>
                <div class="export-controls">
                    <button id="exportSrtBtn" class="primary">📤 导出SRT</button>
                    <button id="exportTxtBtn">📄 导出TXT</button>
                    <button id="exportJsonBtn">📋 导出JSON</button>
                </div>
            </div>

            <div id="subtitleHistoryList" class="subtitle-history-list">
                <!-- 字幕历史条目将在这里动态生成 -->
            </div>

            <div class="subtitle-history-stats">
                <span>共 <strong id="subtitleTotalCount">0</strong> 条字幕记录</span>
                <span>最早: <strong id="subtitleEarliestTime">-</strong></span>
                <span>最新: <strong id="subtitleLatestTime">-</strong></span>
            </div>
        </div>
    </div>

    <script src="./js/i.js"></script>
</body>
</html>
