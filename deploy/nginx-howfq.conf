server {
    listen 80;
    server_name howfq.icu www.howfq.icu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl ;
    http2 on;
    server_name howfq.icu www.howfq.icu;

    ssl_certificate     /www/server/panel/vhost/cert/havealook/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/havealook/privkey.pem;


    # 其他 SSL 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+AESGCM:EECDH+AES256:EECDH+AES128:!MD5;
    ssl_prefer_server_ciphers on;

    # 前端反向代理
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # PeerJS
    location /peerjs/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
