# Reference only for a standalone setup. Production is managed by BaoTa in
# /www/server/panel/vhost/nginx/video.shanbo-rig.com.conf; DO NOT add this alongside it.
# Apply only after a valid certificate has been issued.
server {
    listen 80;
    server_name video.shanbo-rig.com;
    location /.well-known/acme-challenge/ {
        root /www/wwwroot/video.shanbo-rig.com;
    }
    location / {
        return 301 https://video.shanbo-rig.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name video.shanbo-rig.com;
    ssl_certificate /www/server/panel/vhost/cert/video.shanbo-rig.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/video.shanbo-rig.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VIDEO_SSL:10m;
    ssl_session_timeout 1d;
    access_log /www/wwwlogs/webrtc-video.access.log;
    error_log /www/wwwlogs/webrtc-video.error.log;
    client_max_body_size 6m;

    location /.well-known/acme-challenge/ {
        root /www/wwwroot/video.shanbo-rig.com;
    }
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
